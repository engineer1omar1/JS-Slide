<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Slider</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="slider-container">
        <div id="slide-number" class="slide-number"></div>


  <img src="https://picsum.photos/id/28/800/250" width="800" height="250" alt="Nature">
  <img src="https://picsum.photos/id/29/800/250" width="800" height="250" alt="Nature">
  <img src="https://picsum.photos/id/1015/800/250" width="800" height="250" alt="Nature">
  <img src="https://picsum.photos/id/1043/800/250" width="800" height="250" alt="Nature">
   <img src="https://images.unsplash.com/photo-1550439062-609e1531270e?w=800&h=250&fit=crop" width="800" height="250" alt="Programming code">

    </div>
    <div class="slider-controls">
        <div id="prev" class="prev">Previous</div>
        <div id="indicators" class="indicators"></div>
        <div id="next" class="next">Next</div>
    </div>
    <script src="main.js"></script>
</body>
</html>
